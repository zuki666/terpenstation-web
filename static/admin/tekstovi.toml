# Zbirke „Tekstovi” i „Stranice” u Sveltia CMS-u (W42). index.html je učitava uz config.yml, a
# Sveltia ih spoji u jednu postavku. TOML, a ne YAML, jer ga testovi čitaju bez novog paketa:
# svako polje mora postojati u jezici/hr.toml (testovi/test_tekstovi.py).
#
# Tekstovi blagajne, zahvale, mailova i grešaka nisu ovdje: njih iscrtava i server iz svoje
# kopije repoa, pa bi izmjena iz CMS-a na webu vrijedila odmah, a u mailu tek nakon git pull.
# Polje s {sorta} ili {iznos} ima pattern, jer gradnja tekst bez toga odbije i ostavi stari.

[[collections]]
name = "tekstovi"
label = "Tekstovi"
label_singular = "Tekst"
description = "Tekstovi na webu, po stranicama. Spremljena izmjena je na sajtu za oko 3 minute."
format = "json"
i18n = true
editor = { preview = false }

[[collections.files]]
name = "naslovna"
label = "Naslovna"
file = "sadrzaj/tekstovi/{{locale}}/naslovna.json"
i18n = true

[[collections.files.fields]]
name = "naslovna"
label = "Naslovna"
widget = "object"
i18n = true
fields = [
  { name = "nadnaslov", label = "Nadnaslov", widget = "string", i18n = true, hint = "Mali natpis iznad TERPEN STATION, na vrhu stranice." },
  { name = "uvod", label = "Uvod", widget = "text", i18n = true, hint = "Odlomak ispod TERPEN STATION." },
  { name = "u_trgovinu", label = "Gumb u trgovinu", widget = "string", i18n = true, hint = "Prvi gumb ispod uvoda." },
  { name = "kako_raste", label = "Gumb do uzgoja", widget = "string", i18n = true, hint = "Drugi gumb ispod uvoda; vodi niže, na stanice od tla do paketa." },
  { name = "polasci", label = "Ploča: naslov", widget = "string", i18n = true, hint = "Ploča s proizvodima uz uvod, kao ploča polazaka na kolodvoru." },
  { name = "polasci_opis", label = "Ploča: podnaslov", widget = "string", i18n = true },
  { name = "mjesto", label = "Ploča: mjesto uz sat", widget = "string", i18n = true },
  { name = "dostupno", label = "Ploča: status u retku", widget = "string", i18n = true, hint = "Desno u svakom retku ploče." },
  { name = "ponuda_nadnaslov", label = "Ponuda: nadnaslov", widget = "string", i18n = true, hint = "Iznad popisa proizvoda." },
  { name = "istaknuto", label = "Ponuda: naslov", widget = "string", i18n = true },
  { name = "izbliza_nadnaslov", label = "Izbliza: nadnaslov", widget = "string", i18n = true, hint = "Odjeljak sa snimkom i dvije fotke cvijeta." },
  { name = "izbliza_naslov", label = "Izbliza: naslov", widget = "string", i18n = true },
  { name = "izbliza_tekst", label = "Izbliza: tekst", widget = "text", i18n = true },
  { name = "linija_nadnaslov", label = "Stanice: nadnaslov", widget = "string", i18n = true, hint = "Odjeljak s pet stanica od tla do paketa; same stanice su u „Naslovna: stanice”." },
  { name = "linija_naslov", label = "Stanice: naslov", widget = "string", i18n = true },
  { name = "linija_uvod", label = "Stanice: uvod", widget = "text", i18n = true },
  { name = "naslov_stranice", label = "Naslov za Google", widget = "string", i18n = true, hint = "Naslov naslovne u Googleu i na kartici preglednika." },
  { name = "opis", label = "Opis za Google", widget = "text", i18n = true, hint = "Opis naslovne u Googleu i u pregledu linka (WhatsApp, Instagram); najbolje do 160 znakova." },
]

