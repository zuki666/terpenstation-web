# Sveltia CMS za proizvode i dnevnik uzgoja. Spremanje ide izravno u main, a svaka izmjena
# je commit (W10); {{collection}} je ime zbirke u jednini (Proizvod, Zapis).
backend:
  name: github
  repo: zuki666/terpenstation-web
  branch: main
  base_url: https://sveltia-cms-auth.drproper-dobarbad.workers.dev
  commit_messages:
    create: "{{collection}}: novi {{slug}}"
    update: "{{collection}}: izmjena {{slug}}"
    delete: "{{collection}}: brisanje {{slug}}"
    uploadMedia: "Slika: {{path}}"
    deleteMedia: "Slika obrisana: {{path}}"

site_url: https://terpenstation.com
display_url: https://terpenstation.com

media_folder: static/slike
public_folder: /slike
media_libraries:
  default:
    config:
      slugify_filename: true
      # Slike se smanjuju i pretvaraju u WebP već na mobitelu, prije slanja u repo.
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

slug:
  encoding: ascii
  clean_accents: true

i18n:
  structure: single_file
  locales: [hr]
  default_locale: hr

collections:
  - name: proizvodi
    label: Proizvodi
    label_singular: Proizvod
    folder: sadrzaj/proizvodi
    extension: json
    format: json
    create: true
    delete: true
    i18n: true
    identifier_field: naziv
    slug: "{{naziv}}"
    summary: "{{naziv}} · {{kategorija}}"
    sortable_fields: [redoslijed, naziv, kategorija]
    fields:
      - name: naziv
        label: Naziv
        widget: string
        i18n: true
        hint: Iz naziva nastaje adresa stranice pri prvom spremanju.
      - name: kratki_opis
        label: Kratki opis
        widget: text
        i18n: true
        required: false
        hint: Jedna ili dvije rečenice za popis proizvoda.
      - name: opis
        label: Opis
        widget: markdown
        i18n: true
        required: false
        hint: Duži opis na stranici proizvoda.
      - name: kategorija
        label: Kategorija
        widget: select
        options:
          - { label: Cvijet, value: cvijet }
          - { label: Pribor, value: pribor }
          - { label: Ulje, value: ulje }
        i18n: duplicate
      - name: dostupno
        label: Dostupno
        widget: boolean
        default: true
        i18n: duplicate
        hint: Isključeno = proizvod se ne prikazuje i ne može se naručiti.
      - name: redoslijed
        label: Redoslijed
        widget: number
        value_type: int
        required: false
        i18n: duplicate
        hint: Manji broj ide prije; prazno = na kraj.
      - name: slike
        label: Slike
        widget: image
        multiple: true
        required: false
        i18n: duplicate
        hint: Prva slika je glavna.
      - name: pakiranja
        label: Pakiranja i cijene
        label_singular: Pakiranje
        widget: list
        min: 1
        i18n: duplicate
        summary: "{{oznaka}} · {{cijena}} €"
        hint: Proizvod bez varijanti ima jedno pakiranje.
        fields:
          - name: oznaka
            label: Pakiranje
            widget: string
            hint: Npr. 1 g, 3 g, 50 listića.
          - name: cijena
            label: Cijena s PDV-om (€)
            widget: number
            value_type: float
            min: 0
            step: 0.1
            hint: Cijena s PDV-om, u eurima, npr. 9.90.
          - name: tezina_g
            label: Težina (g)
            widget: number
            value_type: float
            min: 0
            required: false
            hint: Neobavezno; treba za BOX NOW.
      - name: cbg
        label: CBG %
        widget: string
        required: false
        i18n: duplicate
        hint: Samo za cvijet, npr. 8,08 %.
      - name: thc
        label: THC %
        widget: string
        required: false
        i18n: duplicate
        hint: Samo za cvijet, npr. 0,09 %.
      - name: sarza
        label: Šarža
        widget: string
        required: false
        i18n: duplicate
        hint: Oznaka šarže s analize, npr. 102-4.
      - name: analiza
        label: PDF analize
        widget: file
        required: false
        i18n: duplicate
        media_folder: /static/analize
        public_folder: /analize
        hint: Laboratorijska analiza šarže koja je u prodaji.

  # Dnevnik uzgoja (W38). Uvoz s Instagrama (W9) piše iste datoteke i ista polja.
  - name: dnevnik
    label: Dnevnik uzgoja
    label_singular: Zapis
    folder: sadrzaj/dnevnik
    extension: json
    format: json
    create: true
    delete: true
    i18n: true
    identifier_field: naslov
    slug: "{{datum}}-{{naslov}}"
    summary: "{{datum}} · {{naslov}}"
    sortable_fields: [datum, naslov]
    fields:
      - name: naslov
        label: Naslov
        widget: string
        i18n: true
        hint: Iz datuma i naslova nastaje adresa zapisa pri prvom spremanju.
      - name: datum
        label: Datum
        widget: datetime
        type: date
        format: YYYY-MM-DD
        i18n: duplicate
      - name: tekst
        label: Tekst
        widget: markdown
        i18n: true
        required: false
        hint: Prvi odlomak ide i na popis dnevnika.
      - name: slike
        label: Fotke
        widget: image
        multiple: true
        required: false
        i18n: duplicate
        media_folder: /static/slike/dnevnik
        public_folder: /slike/dnevnik
        hint: Prva je naslovna; uz video to je slika prije pokretanja.
      - name: video
        label: Video (MP4)
        widget: file
        required: false
        i18n: duplicate
        media_folder: /static/mediji/dnevnik
        public_folder: /mediji/dnevnik
        hint: Do 25 MB; duži video ostaje na Instagramu.
      - name: trajanje_s
        label: Trajanje videa (s)
        widget: number
        value_type: int
        min: 0
        required: false
        i18n: duplicate
        hint: Upisuje uvoz s Instagrama; može ostati prazno.
      - name: video_na_instagramu
        label: Video samo na Instagramu
        widget: boolean
        default: false
        i18n: duplicate
        hint: Za reel bez datoteke na sajtu; slika tada vodi na objavu.
      - name: faza
        label: Faza
        widget: select
        required: false
        i18n: duplicate
        options:
          - { label: Živo tlo, value: tlo }
          - { label: Vegetacija, value: vegetacija }
          - { label: Cvjetanje, value: cvjetanje }
          - { label: Berba, value: berba }
          - { label: Sušenje, value: susenje }
          - { label: Analiza, value: analiza }
      - name: proizvod
        label: Sorta
        widget: relation
        collection: proizvodi
        value_field: "{{slug}}"
        search_fields: [naziv]
        display_fields: [naziv]
        required: false
        i18n: duplicate
        hint: Zapis se pokaže i na stranici te sorte.
      - name: instagram
        label: Objava na Instagramu
        widget: string
        required: false
        i18n: duplicate
        hint: Link na objavu, npr. https://www.instagram.com/p/…
      - name: objavljeno
        label: Objavljeno
        widget: boolean
        default: true
        i18n: duplicate
        hint: Isključeno = zapis se ne prikazuje (npr. promocija s Instagrama).
