{% extends "osnova.html" %}
{% block sadrzaj %}
<h1>{{ t.kosarica.naslov }}</h1>
<div class="kosarica" data-kosarica>
  <p class="poruka" data-poruka role="status" hidden></p>
  <div data-prazna hidden>
    <p>{{ t.kosarica.prazna }}</p>
    <p><a class="gumb" href="{{ put('naslovna') }}">{{ t.kosarica.u_trgovinu }}</a></p>
  </div>
  <ul class="stavke" data-stavke></ul>
  <div class="zbroj" data-zbroj hidden>
    <p class="red-zbroja"><span>{{ t.kosarica.meduzbroj }}</span> <strong data-meduzbroj></strong></p>
    <p class="napomena">{{ t.kosarica.dostava_napomena }}</p>
    <a class="gumb gumb-glavni" href="{{ put('blagajna') }}">{{ t.kosarica.na_blagajnu }}</a>
  </div>
  <noscript><p>{{ t.opcenito.treba_js }}</p></noscript>
</div>
<template id="predlozak-stavke">
  <li class="stavka">
    <a class="stavka-slika" data-poveznica tabindex="-1" aria-hidden="true"><img data-slika alt="" width="80" height="100"></a>
    <div class="stavka-opis">
      <a data-naziv data-poveznica></a>
      <span class="napomena" data-oznaka></span>
      <span class="napomena" data-cijena></span>
    </div>
    <label class="kolicina">{{ t.kosarica.kolicina }}
      <input type="number" min="1" max="20" inputmode="numeric" data-kolicina>
    </label>
    <strong class="stavka-iznos" data-iznos></strong>
    <button class="ukloni" type="button" data-ukloni>{{ t.kosarica.ukloni }}</button>
  </li>
</template>
{% endblock %}
